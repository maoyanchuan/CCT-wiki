向蜡烛与诅咒附魔书、幽匿与残骸和耐久／经验修补附魔书、蜘蛛网和线。蜘蛛走廊同时有蜘蛛与洞穴蜘蛛刷怪笼。","捣蛋鬼主题走廊：矿物、矿车、铁轨与探矿补给。嗅探兽主题藏有一件远古残骸，凝灰岩傀儡主题有大量凝灰岩；这些名称是建筑主题，不代表会生成对应特殊生物。","会议室、生活区、喷泉与繁茂走廊：主要用于环境探索和建筑装饰；繁茂走廊可遇到美西螈，部分景观室有末影箱。","传送门房：有普通、高层和大型洞窟三种外观。可探索图书与酿造容器；普通型和大型洞窟型另有矿物宝藏。传送门房有蠹虫刷怪笼、岩浆和高低落差。"]},{"heading":"使用提示","paragraphs":["提防蠹虫、蜘蛛和洞穴蜘蛛刷怪笼，以及掠夺者、卫道士、唤魔者、女巫和幻术师。门房岩浆与高低落差也很危险。","不是每座要塞都有全部房间或全部宝物。幽匿装饰不代表这里必定有监守者；大图书馆的一处旧宝箱目前没有有效奖励，请以其他可正常开启的容器为探索目标。"],"bullets":[]},{"heading":"服务器范围","paragraphs":["本条介绍冒险服的末地扩展或要塞改造。生存服不会因为带入相应装备、钥匙或探险地图，就生成这里介绍的改造结构。"],"bullets":[]}],"relatedNames":["末地龙巢","圣弓","铜能量盾","障壁之书"],"recipes":[],"sourcePack":"Stellarity"},{"id":"structure-dragons-den","kind":"structure","name":"末地龙巢","aliases":["Dragon’s Den"],"category":"末地","summary":"主岛的末影龙战场，也是诅咒祭坛和外岛探索的起点。","facts":[{"label":"主要目标","value":"挑战末影龙并解锁后续探索"}],"sections":[{"heading":"在哪里","paragraphs":["从主世界要塞进入末地，到达中央主岛。主岛有黑曜石柱、末地水晶和中央返回区域。"],"bullets":[]},{"heading":"探索与奖励","paragraphs":["击败末影龙后可使用返回通道，并推进诅咒祭坛的解锁。","主岛的补给箱包含四个末地水晶及部分基础材料，可作为后续准备的一部分。","继续探索外岛，寻找末地城、村庄、光之圣堂、沉船与地牢。"],"bullets":[]},{"heading":"使用提示","paragraphs":["末影龙战斗与主岛地形经过修改，应准备远程武器、治疗和防坠落手段。","诅咒祭坛在主岛独立存在，不是中央返回传送门。"],"bullets":[]},{"heading":"服务器范围","paragraphs":["本条介绍冒险服的末地扩展或要塞改造。生存服不会因为带入相应装备、钥匙或探险地图，就生成这里介绍的改造结构。"],"bullets":[]}],"relatedNames":["诅咒祭坛","末地城","返回折跃门"],"recipes":[],"sourcePack":"Stellarity"},{"id":"structure-accursed-altar","kind":"structure","name":"主岛诅咒祭坛","aliases":["Main-island Accursed Altar"],"category":"末地","summary":"击败末影龙后启用的高级制作地点。","facts":[{"label":"解锁条件","value":"击败末影龙"},{"label":"功能","value":"高级制作、升级与吊坠镶嵌"}],"sections":[{"heading":"在哪里","paragraphs":["位于末地主岛东北一侧，祭坛中心大约在 X=50、Y=77、Z=−39。"],"bullets":[]},{"heading":"探索与奖励","paragraphs":["击败末影龙后等待祭坛激活动画完成，可取得祭坛上的龙之刃。","把配方要求的材料投入祭坛中心，可制作或升级指定特殊装备、处理虚空吊坠镶嵌，以及进行其他专属合成。","潜影工具和潜影护甲使用强化潜影壳作为材料；强化潜影壳来自潜影贝之王。"],"bullets":[]},{"heading":"使用提示","paragraphs":["先解锁再投料；按每件物品的配方准确准备数量和分堆，不要把多套无关材料同时扔进去。","它与光之圣堂里的神圣祭坛用途不同。"],"bullets":[]},{"heading":"服务器范围","paragraphs":["本条介绍冒险服的末地扩展或要塞改造。生存服不会因为带入相应装备、钥匙或探险地图，就生成这里介绍的改造结构。"],"bullets":[]}],"relatedNames":["龙之刃","虚空吊坠","强化潜影壳","神圣祭坛"],"recipes":[],"sourcePack":"Stellarity"},{"id":"structure-end-city","kind":"structure","name":"末地城","aliases":["End City"],"category":"末地","summary":"带有新房间、试炼战斗和钥匙宝库的末地大型据点。","facts":[{"label":"主要目标","value":"探索装备、挑战试炼并开启宝库"}],"sections":[{"heading":"在哪里","paragraphs":["分布于末地外岛的多种高地、森林、沙丘和寒冷群系；部分沉船中可找到末地城探索地图。"],"bullets":[]},{"heading":"探索与奖励","paragraphs":["城内包含图书、农作、钓鱼、酿造、紫水晶与储物等房间。搜索箱子、木桶和饰纹陶罐，可得附魔装备、末影合金碎片、药水和其他补给。","完成普通试炼刷怪笼挑战有机会获得紫珀钥匙，用来开启普通宝库；完成不祥挑战可获得鎏金紫珀钥匙，开启不祥宝库。","两类宝库均可能产出暴击之刃、虚空之刃或虚空之箭附魔书。普通宝库还可能有归返之书；不祥宝库有更高阶装备、材料、食物与珍稀武器机会。","当前修改版的不祥宝库必定额外给出一颗蔚蓝时空宝石。末地船的翼之宝库另有自己的钥匙和奖励。"],"bullets":[]},{"heading":"使用提示","paragraphs":["潜影贝的漂浮攻击、楼层落差和试炼怪物会叠加风险；注意预留退路。","紫珀钥匙、鎏金紫珀钥匙和翼之钥匙不能互换。普通钥匙宝库没有本次追加的必得时空宝石。"],"bullets":[]},{"heading":"服务器范围","paragraphs":["本条介绍冒险服的末地扩展或要塞改造。生存服不会因为带入相应装备、钥匙或探险地图，就生成这里介绍的改造结构。"],"bullets":[]}],"relatedNames":["紫珀钥匙","鎏金紫珀钥匙","翼之钥匙","蔚蓝时空宝石","末地船与翼之宝库","暴击之刃","虚空之刃","虚空之箭"],"recipes":[],"sourcePack":"Stellarity"},{"id":"structure-end-ship","kind":"structure","name":"末地船与翼之宝库","aliases":["End Ship","Elytra Vault"],"category":"末地","summary":"末地城的高空船只，鞘翅与翼之钥匙的关键目标。","facts":[{"label":"必得奖励","value":"鞘翅、烟花火箭、蔚蓝时空宝石"}],"sections":[{"heading":"在哪里","paragraphs":["探索带船只的末地城；并非每座末地城都会带船。"],"bullets":[]},{"heading":"探索与奖励","paragraphs":["船上有宝箱、储物与宝库。完成船上的专属试炼，有机会获得翼之钥匙；虚空钓鱼宝藏也有极低机会获得这把钥匙。","用翼之钥匙开启翼之宝库，必得鞘翅和3—7个烟花火箭；另可能得到装甲、翱翔、耐久或经验修补附魔书。","当前修改版的翼之宝库还必得一颗蔚蓝时空宝石。"],"bullets":[]},{"heading":"使用提示","paragraphs":["不要把普通紫珀钥匙或鎏金紫珀钥匙当作翼之钥匙。","鞘翅和烟花到手后仍应检查装备栏和耐久，再从高处起飞。"],"bullets":[]},{"heading":"服务器范围","paragraphs":["本条介绍冒险服的末地扩展或要塞改造。生存服不会因为带入相应装备、钥匙或探险地图，就生成这里介绍的改造结构。"],"bullets":[]}],"relatedNames":["翼之钥匙","装甲","翱翔","蔚蓝时空宝石","末地城"],"recipes":[],"sourcePack":"Stellarity"},{"id":"structure-village","kind":"structure","name":"末地村庄","aliases":["End Village"],"category":"末地","summary":"以末影合金碎片交易的外岛聚落，兼具补给与特殊装备来源。","facts":[{"label":"主要用途","value":"交易、补给与探索地图"}],"sections":[{"heading":"在哪里","paragraphs":["可在神圣之地、神圣苔原、棱彩沙丘、末地高地、海晶森林、紫水晶森林、末地中部、无尽沙丘、诡异沼泽和冰封沼泽发现。"],"bullets":[]},{"heading":"探索与奖励","paragraphs":["村庄包含职业房屋、市场、图书馆、农场和生活建筑。不同容器提供书、装备、矿物、食物、鱼类和职业相关用品。","末地村民主要使用末影合金碎片交易。出售合适物资可以赚取碎片，再向不同职业购买特殊装备、工具、食物与药水。","制图师可提供探索地图，帮助寻找光之圣堂等目标。交易内容按职业和等级变化。"],"bullets":[]},{"heading":"使用提示","paragraphs":["它是交易聚落，不是另一种末地城；不要把所有职业房屋都当作同一种宝箱。","末地村民定制的附魔书商品范围，与主世界普通图书管理员不同。"],"bullets":[]},{"heading":"服务器范围","paragraphs":["本条介绍冒险服的末地扩展或要塞改造。生存服不会因为带入相应装备、钥匙或探险地图，就生成这里介绍的改造结构。"],"bullets":[]}],"relatedNames":["末影合金碎片","光之圣堂","末地城"],"recipes":[],"sourcePack":"Stellarity"},{"id":"structure-chapel","kind":"structure","name":"光之圣堂","aliases":["Chapel of Light","光明教堂","光之礼拜堂"],"category":"末地","summary":"神圣群系中的花园教堂，中心设有神圣祭坛。","facts":[{"label":"主要用途","value":"材料祝福与Boss召唤"}],"sections":[{"heading":"在哪里","paragraphs":["在神圣之地、棱彩沙丘、神圣苔原寻找；末地村庄制图师出售的相关探索地图可帮助定位。"],"bullets":[]},{"heading":"探索与奖励","paragraphs":["教堂由中心建筑、花园和周边建筑组成。花园提供花卉与植物，装备容器可能有工具、附魔书，或稀有的无星镰刀。","中心的神圣祭坛可祝福指定材料。投入星辉尘可挑战光之女皇；在末地投入潜影贝核心可挑战潜影贝之王，需满足各自召唤条件。"],"bullets":[]},{"heading":"使用提示","paragraphs":["召唤前清出战斗区域。光之女皇在白昼的战斗更危险，奖励也与通常形态不同。","不要把神圣祭坛与主岛诅咒祭坛的配方混用。"],"bullets":[]},{"heading":"服务器范围","paragraphs":["本条介绍冒险服的末地扩展或要塞改造。生存服不会因为带入相应装备、钥匙或探险地图，就生成这里介绍的改造结构。"],"bullets":[]}],"relatedNames":["神圣祭坛","星辉尘","潜影贝核心","光之女皇","潜影贝之王","无星镰刀"],"recipes":[],"sourcePack":"Stellarity"},{"id":"structure-campsite","kind":"structure","name":"末地营地","aliases":["Campsite"],"category":"末地","summary":"帐篷与补给箱组成的小型探索停靠点。","facts":[{"label":"主要奖励","value":"补给、末影合金碎片、附魔书"}],"sections":[{"heading":"在哪里","paragraphs":["在末地多种外岛地形寻找，包括高地、中部、荆原、森林、沼泽、寒冷区域和无尽沙丘。"],"bullets":[]},{"heading":"探索与奖励","paragraphs":["帐篷箱能找到末影合金碎片、书、矿物和随机附魔书；食物容器提供作物、面包与紫颂果。","营地有不同外观，容器数量和内容不会完全相同。"],"bullets":[]},{"heading":"使用提示","paragraphs":["适合补充消耗品，但不是带有钥匙宝库的战斗据点。","留意周围自然生成的敌对生物，不要把营地视为安全区。"],"bullets":[]},{"heading":"服务器范围","paragraphs":["本条介绍冒险服的末地扩展或要塞改造。生存服不会因为带入相应装备、钥匙或探险地图，就生成这里介绍的改造结构。"],"bullets":[] 接命中后按附魔等级抽取机会，成功后，下一次攻击获得双倍伤害并消耗这次机会。","这是提前准备下一击的效果，不需要像原版跳跃暴击那样从空中落下。"],"bullets":[]},{"heading":"获取方式","paragraphs":["使用紫珀钥匙或鎏金紫珀钥匙开启末地城相应宝库，有机会得到暴击之刃 I—III 的附魔书。","不通过普通附魔台或普通图书管理员常规交易取得。"],"bullets":[]},{"heading":"使用提示","paragraphs":["与锋利、亡灵杀手、节肢杀手等互斥伤害附魔不兼容，也不能与灵魂收割者的固有附魔共存。","多人贴身围攻时，若附近另一名持有此附魔的玩家也已准备暴击，暴击机会的消耗可能出现异常。"],"bullets":[]}],"relatedNames":["紫珀钥匙","鎏金紫珀钥匙","末地城","灵魂收割者"],"recipes":[],"sourcePack":"Stellarity","survival":{"status":"partial","label":"生存服可用（计算方式有差异）","summary":"成功近战命中后有10%／20%／30%概率准备下一击；准备好的下一次有效命中触发双倍伤害。","details":["暴击后可再次准备；取消命中和完全盾挡不消耗准备，换下武器也会保留准备。","生存服把该次攻击在减免前的基础伤害翻倍，包含原版下落重击等已生效的加成；冒险服的计算顺序更早，复合加成的数值可能不同。","同一刻的后续扫击不会重复消耗这次暴击机会；若一次命中没有成功触发暴击，准备好的机会会保留到后续有效命中。","生存服使用普通暴击粒子与原包音效。"]}},{"id":"enchantment-dune-speed","kind":"enchantment","name":"沙丘疾行","aliases":["Dune Speed"],"category":"宝藏附魔","summary":"穿上靴子，在沙地和松散地面上快速移动。","facts":[{"label":"最高等级","value":"3"},{"label":"适用装备","value":"靴子"},{"label":"各级效果","value":"I：移动速度+0.025；II：+0.034；III：+0.043"}],"sections":[{"heading":"效果","paragraphs":["在沙子、红沙、可疑的沙子、沙砾、可疑的沙砾以及各色混凝土粉末上加速。相对普通玩家基础移动速度，约增加25%、34%、43%。","已在合适地面获得加速时，跳起后可以暂时保持；乘坐载具或飞行不激活。"],"bullets":[]},{"heading":"获取方式","paragraphs":["在无尽沙丘中的沉船遗迹刷扫可疑方块，有机会找到沙丘疾行 I—III 附魔书。","普通沉船和一般附魔台、图书管理员交易不是它的专属获取渠道。"],"bullets":[]},{"heading":"使用提示","paragraphs":["与灵魂疾行互斥。","在适用地面移动时，会小概率额外消耗靴子耐久；长距离赶路要留意耐久。"],"bullets":[]}],"relatedNames":["沙丘沉船"],"recipes":[],"sourcePack":"Stellarity","survival":{"status":"none","label":"生存服不生效","summary":"可带回并附到装备上，但在生存服不会触发该附魔效果。","details":["不会获得沙地加速；名称、等级或附魔光效保留不代表能力可用。"]}},{"id":"enchantment-levitation-shot","kind":"enchantment","name":"漂浮之箭","aliases":["Levitation Shot"],"category":"普通附魔","summary":"箭矢命中时，有概率让目标短暂漂浮。","facts":[{"label":"最高等级","value":"5"},{"label":"适用装备","value":"弓；不适用于弩"},{"label":"各级效果","value":"I：15%，4—7秒；II：22.32%，4.5—7.5秒；III：28.23%，5—8秒；IV：33.09%，5.5—8.5秒；V：37.16%，6—9秒"}],"sections":[{"heading":"效果","paragraphs":["成功触发时施加漂浮 I，附魔升级同时提高触发概率和持续时间。","必须是箭矢命中；拿弓近身敲击不会触发。"],"bullets":[]},{"heading":"获取方式","paragraphs":["附魔台可为弓或书附上漂浮之箭。","可通过普通图书管理员交易获得附魔书；探索主世界要塞、末地城、末地营地、沉船及末地村庄的书类战利品，也有机会找到。","普通钓鱼的宝藏附魔书或附魔弓，以及末地虚空钓鱼的书类宝藏，也可能提供此附魔。"],"bullets":[]},{"heading":"使用提示","paragraphs":["末地村庄里的定制图书管理员有自己的商品范围，不保证出售这些新增附魔书。","可以与虚空之箭共存；漂浮并不是每次命中必定触发。"],"bullets":[]}],"relatedNames":["虚空之箭","末地城","渔夫小屋"],"recipes":[],"sourcePack":"Stellarity","survival":{"status":"native","label":"生存服可用","summary":"弓箭命中后概率令目标漂浮；随等级提高，概率从15%提高至约37.16%，持续时间从4–7秒提高至6–9秒。","details":["最高V级，持续漂浮I；沿用冒险服的概率与时长。"]}},{"id":"enchantment-plated","kind":"enchantment","name":"装甲","aliases":["Plated"],"category":"普通附魔","summary":"以更重的飞行手感换取鞘翅的护甲属性。","facts":[{"label":"最高等级","value":"4"},{"label":"适用装备","value":"鞘翅"},{"label":"各级效果","value":"I—IV：护甲+2/+3/+4/+5；韧性+0/+0/+1/+1；重力+4%/+7%/+10%/+13%"}],"sections":[{"heading":"效果","paragraphs":["这项附魔的设计是给鞘翅增加护甲，并增加重力。护甲点不是生命值，也不是固定比例的减伤。","当前冒险服版本中，玩家正常穿戴鞘翅时此附魔不会生效；本页数值是设计属性，并非当前可获得的护甲加成。"],"bullets":[]},{"heading":"获取方式","paragraphs":["给普通书使用附魔台，有机会得到装甲附魔书。","可通过普通图书管理员交易获得附魔书；探索主世界要塞、末地城、末地营地、沉船及末地村庄的书类战利品，也有机会找到。","末地船的翼之宝库也可能额外给出装甲附魔书。通常先拿到书，再用铁砧附到鞘翅。"],"bullets":[]},{"heading":"使用提示","paragraphs":["与翱翔互斥。","鞘翅不能因为有此附魔就直接作为普通装备放入附魔台；可以先给书附魔。"],"bullets":[]}],"relatedNames":["翱翔","翼之钥匙","末地船与翼之宝库"],"recipes":[],"sourcePack":"Stellarity","survival":{"status":"native","label":"生存服可用","summary":"穿戴附魔鞘翅增加护甲、部分等级增加韧性，但会加大重力。","details":["I–IV级分别增加2／3／4／5护甲，0／0／1／1韧性，基础重力增加4%／7%／10%／13%。","与翱翔互斥；仅穿在身上生效，放在背包或手持无效。","生存服已修正穿戴位置；当前冒险服源定义尚未作同样修正。"]}},{"id":"enchantment-soaring","kind":"enchantment","name":"翱翔","aliases":["Soaring"],"category":"普通附魔","summary":"降低鞘翅使用者的重力，帮助延长滑翔。","facts":[{"label":"最高等级","value":"4"},{"label":"适用装备","value":"鞘翅"},{"label":"各级效果","value":"I：重力−5%；II：−10%；III：−15%；IV：−20%"}],"sections":[{"heading":"效果","paragraphs":["附魔的设计是减少下坠所受的重力，不会赋予无限飞行，也没有固定增加飞行速度。","当前冒险服版本中，玩家正常穿戴鞘翅时此附魔不会生效；本页列的是设计减重幅度，并非当前实际加成。"],"bullets":[]},{"heading":"获取方式","paragraphs":["给普通书使用附魔台，有机会得到翱翔附魔书。","可通过普通图书管理员交易获得附魔书；探索主世界要塞、末地城、末地营地、沉船及末地村庄的书类战利品，也有机会找到。","末地船的翼之宝库也可能额外给出翱翔附魔书。通常通过铁砧将附魔书用于鞘翅。"],"bullets":[]},{"heading":"使用提示","paragraphs":["与装甲互斥。","仍需注意烟花、鞘翅耐久和落地安全。"],"bullets":[]}],"relatedNames":["装甲","翼之钥匙","末地船与翼之宝库"],"recipes":[],"sourcePack":"Stellarity","survival":{"status":"native","label":"生存服可用","summary":"穿戴附魔鞘翅时降低重力，让飞行更轻盈。","details":["I–IV级分别降低5%／10%／15%／20%基础重力；与装甲互斥。","仅穿在身上生效；生存服已修正穿戴位置，当前冒险服源定义尚未作同样修正。"]}},{"id":"enchantment-void-shot","kind":"enchantment","name":"虚空之箭","aliases":["Void Shot"],"category":"宝藏附魔","summary":"用箭矢让敌人暂时虚化，削减其最大生命值。","facts":[{"label":"最高等级","value":"1"},{"label":"适用装备","value":"弓、弩"},{"label":"各级效果","value":"I：最大生命值减少20%，持续8秒"}],"sections":[{"heading":"效果","paragraphs":["箭矢命中后施加8秒虚化；再次命中刷新持续时间，不把最大生命值减幅反复叠加。","效果结束后恢复正常最大生命值。玩家受到虚化时还伴有凋零干扰与音效。"],"bullets":[]},{"heading":"获取方式","paragraphs":["末地城普通宝库和不祥宝库有机会产出虚空之箭附魔书。","虚空之唤自带此附魔，也能作为体验它的特殊武器；它的额外碎片攻击属于该武器本身。"],"bullets":[]},{"heading":"使用提示","paragraphs":["不能通过普通附魔台或普通图书管理员常规交易取得。","属于无法用砂轮正常去除的特殊附魔；普通附魔弓弩不会仅因带上虚空之箭而获得虚空之唤的全部能力。"],"bullets":[]}],"relatedNames":["虚空之唤","紫珀钥匙","鎏金紫珀钥匙","末地城"],"recipes":[],"sourcePack":"Stellarity","survival":{"status":"partial","label":"虚化可用，规则有差异","summary":"普通主手弓或弩可触发8秒虚化，部分处理规则与冒险服不同。","details":["箭矢命中后降低目标20%最大生命值，重复命中刷新时间；不要求使用虚空之唤。","用副手发射时不会触发这项效果；请把弓或弩放在主手。","两服均不能用砂轮去除该附魔。"]}},{"id":"enchantment-void-strike","kind":"enchantment","name":"虚空之刃","aliases":["Void Strike"],"category":"宝藏附魔","summary":"用普通近战命中让敌人暂时虚化。","facts":[{"label":"最高等级","value":"1"},{"label":"适用装备","value":"剑、斧、矛、重锤可附魔；实际触发受攻击方式限制"},{"label":"各级效果","value":"I：最大生命值减少20%，持续8秒"}],"sections":[{"heading":"效果","paragraphs":["有效的直接近战命中会令目标虚化8秒，最大生命值降低20%；反复命中只刷新持续时间。","没有“仅普通小怪有效”的额外限制，但无敌、完全格挡等未形成有效命中的情况不会因此绕过防御。"],"bullets":[]},{"heading":"获取方式","paragraphs":["使用紫珀钥匙或鎏金紫珀钥匙开启末地城相应宝库，有机会得到附魔书。","不通过普通附魔台或普通图书管理员常规交易取得。"],"bullets":[]},{"heading":"使用提示","paragraphs":["当前版本以普通近战伤害触发：剑斧挥击和重锤普通挥击可用，矛的专属攻击和重锤下落重击不属于这类命中。","武器技能伤害、投射物以及手持武器时受到反伤，不能视为普通近战触发。","属于无法用砂轮正常去除的特殊附魔。"],"bullets":[]}],"relatedNames":["虚空之箭","紫珀钥匙","鎏金紫珀钥匙","末地城"],"recipes":[],"sourcePack":"Stellarity","survival":{"status":"partial","label":"近战可用，少数情况受限","summary":"普通近战可触发8秒虚化；武器技能伤害不会代替普通近战触发。","details":["主手武器直接命中后降低目标20%最大生命值，重复命中刷新时间。","剑斧挥击、横扫与重锤普通挥击可用；矛的专属攻击、重锤下落重击和武器技能伤害不会触发。","两服均不能用砂轮去除该附魔。"]}},{"id":"boss-ender-dragon","kind":"boss","name":"末影龙","aliases":["Ender Dragon","龙战"],"category":"首领挑战","summary":"龙巢中的重做首领。先摧毁保护水晶，再应对强化吐息、弹幕和末期水晶复生；击败它会开启诅咒祭坛的成长路线。","facts":[{"label":"地点","value":"末地主岛的龙巢"},{"label":"生命","value":"默认300点（150颗心）"},{"label":"核心进度","value":"解锁诅咒祭坛；初次可取龙之刃"}],"sections":[{"heading":"如何挑战与再次召唤","paragraphs":["进入龙巢挑战。需要再次召唤时，把4个末地水晶分别放到中央返回传送门四个方位的指定水晶基座上；附近不要多放水晶。","等待复活仪式完成，期间不要拆除这4个水晶。当前版本沿用同一套重做龙战，不存在每复活一次就必然追加一档血量的规则。"],"bullets":[]},{"heading":"战斗顺序","paragraphs":[],"bullets":["先摧毁高塔上的全部保护水晶。只要仍有保护水晶，末影龙就处于无敌状态；水晶在本版本主要提供保护，不会持续为龙回复生命。","水晶清完后攻击末影龙，避开强化龙息、连续火球、起飞时的攻击和潜影弹幕。","生命降至25%以下时，会进行一次水晶复生：简单4个、普通5个、困难6个。再次清除水晶，继续输出。","低血量阶段的攻击更紧密；预留末影珍珠、远程武器和安全落脚点。"]},{"heading":"每次击败的物品奖励","paragraphs":[],"bullets":["生命水晶×1：手持并保持静止时逐步增强回血，是持续使用的饰品。","幻翼膜×12–38：修复鞘翅，也可用于部分升级。","龙首×1：33%概率。","龙之翼×1：25%概率，特殊鞘翅。"]},{"heading":"首次胜利后的事","paragraphs":["默认仅首次击败产生龙蛋；服务器若另行开启重复龙蛋，则以服内设置为准。","龙死后约8秒，尚未解锁的诅咒祭坛被激活。前往祭坛与其中的剑互动，取出龙之刃。重复屠龙不会让已经取走的祭坛剑每次重新赠送。"],"bullets":[]},{"heading":"服务器范围","paragraphs":["本页介绍冒险服经过扩展的末影龙战斗与特殊奖励。生存服的原版末影龙不采用本页的改造战斗和奖励；获得的特殊装备能否带回使用，请看物品页。"],"bullets":[]}],"recipes":[],"relatedNames":["诅咒祭坛","末地水晶的安全拆卸","龙之刃","生命水晶","龙之翼"],"sourcePack":"Stellarity","image":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAB8UlEQVR42mWSzU7bQBSFvzhxAul4rLhWRMBFCouoiA0blL5An6Iv09dD2bBBQSyI1ASMUsvpzFhpbC/owpqRKXdjaTznzvnr/Pj+7S3NdkziEY+bLQCzZAxArgsyvSeWQ8qqxhxqAG4uL1CmIAwEvTAQ2AmOfCbxiPPktDnYvFBW9TtwLIcOvFg+4S2WT4SBINcFX6dfSLMdSmkALLNB3yc48gEoq5pcF+7Bnv0BoEyzRJmC1fMr8+srlNLkumDQb+7ZrzIF5lDjmUONMs1GKyfXBWVV056yqh24rGrSbMcsGePNkrGjZBdZzUppdzbo+0zPToikcLLSbIdnnc70nlwXDmCdtssjKXhYrZ3BkRQM+j6edRZwSybx6AM4DATz6ytnrr3fi2STQFtK24O2aXbm11f82rwA4IWBIJLClSiSwtEzh9otstQXyyeXzCwZ043l8Of69x9iOXRU0ywnkoLP8hNpbujwxnHfZ/X8SrcDfq/L37LieNDHs1W14IfVmkzvXaS2xso0Zk/ikat4rovGxEgKR9Ecam4uL/h/2j7ZRzO9x7OXb+/uXXxhKD+Y2a6wnVkyxgtDyeNmyyQeNW0MJbd39yjzPolJPCKSgrbk8+QUTylNLIc8brasnl9RSjudVpKNOs12xHLI9OzEdeEf8iQ9YqYkZJ4AAAAASUVORK5CYII="},{"id":"boss-empress-of-light","kind":"boss","name":"光之女皇","aliases":["Empress of Light","光女","白昼光女"],"category":"首领挑战","summary":"用星辉尘在神圣祭坛召唤的首领。普通挑战与全程白昼挑战有不同的五选二奖励；白昼挑战还必得翱翔徽章。","facts":[{"label":"生命","value":"默认500点（250颗心）"},{"label":"召唤物","value":"星辉尘×1"},{"label":"奖励方式","value":"5种物品等概率抽出不同的2种；每种单次入选率40%"}],"sections":[{"heading":"召唤步骤","paragraphs":[],"bullets":["找到光之圣堂中的神圣祭坛，或把祭坛搬到合适的开阔场地。","准备星辉尘×1。击败神圣地区的小精灵、神圣之地的末地船补给箱和该群系虚空钓鱼都可能获得。","确保服务器不是和平难度，且当前没有另一只光之女皇存活。","把单独1份星辉尘丢到祭坛中心。不要整组投放：同处的多份召唤物可能一起被消耗。"]},{"heading":"普通挑战","paragraphs":["末地、下界和主世界夜间均属于普通状态。主世界白天召唤后若战斗进入夜晚，也无法获得全程白昼奖励。"],"bullets":["棱彩之剑：近战武器，可释放火焰旋斩。","棱彩之弩：发射棱彩爆弹的远程武器。","坠星盾：格挡时召下星体反击。","女皇之翼：特殊鞘翅。","棱彩珍珠：投出后自动返还的特殊末影珍珠。","每次从以上5种中等概率获得不同的2种，另有600经验。"]},{"heading":"白昼加强挑战","paragraphs":["把祭坛搬到主世界，在白天开始挑战，并保持整场战斗直到奖励结算都没有进入夜间。建议清晨开始，避免临近日落。仅在白天补最后一刀不满足条件。","末地和下界不能触发白昼奖励。"],"bullets":["棱彩之剑、棱彩之弩、女皇之翼、炽金狂斧、辉光宝石：5种等概率获得不同的2种。","额外必掉翱翔徽章×1，不占五选二名额。当前徽章仅为纪念收藏品，不再提供飞行或悬浮能力。","白昼结算获得1800经验。坠星盾和棱彩珍珠属于普通奖励，不在白昼五选二中。"]},{"heading":"战斗要点","paragraphs":["女皇会瞬移，释放棱光弹、虚幻长枪并高速冲撞，低血量进入第二阶段。保持移动并为冲撞留出横向闪避空间。","白昼的多项攻击更强。不要离开战场太远：周围约60格内无人时，女皇会离场。"],"bullets":[]},{"heading":"服务器范围","paragraphs":["本条介绍冒险服的首领挑战与奖励。生存服没有移植这些特殊首领的召唤与战利品；把成品装备带回后，效果以各物品页的生存服说明为准。"],"bullets":[]}],"recipes":[],"relatedNames":["神圣祭坛","星辉尘","棱彩之剑","棱彩之弩","坠星盾","女皇之翼","棱彩珍珠","炽金狂斧","辉光宝石","翱翔徽章"],"sourcePack":"Stellarity","image":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAA7ElEQVR42s2SIQ7CMBSGP8gkjgOgOABXIIiFkCC5QAUHwA7BAfATHABJQsgExWHhAMvENGYHIHmIdmPQMUhA8ET7v7b///7XFv4iFmOkPH8lkodWiFYfCj470AqRBJGsWqTWqVaGKFffzCFSJtS265ATi1+IVJMz14FWrhOXnDxVDm1ewqeZK9IsUBtII4M7PkxsvjdLh2lEr+sW9wCOF+ivMaSWD6sIBsAezjFsY3P4uHvzlBLy0EJuubiTinvwcjDf0ACEHYys1W0MwdK6SiOYQGC2xJ43Q91HCYa2tfW9nZz8UqDu15XJP4kbRnXBejhUbRIAAAAASUVORK5CYII="},{"id":"boss-shulking","kind":"boss","name":"潜影贝之王","aliases":["Shulking","潜影之王"],"category":"首领挑战","summary":"只能在末地通过神圣祭坛召唤。核心奖励为强化潜影壳，用于制作潜影系列装备与工具。","facts":[{"label":"地点","value":"末地"},{"label":"生命","value":"默认500点（250颗心）"},{"label":"召唤物","value":"潜影贝核心×1"},{"label":"必得材料","value":"强化潜影壳×3–6"}],"sections":[{"heading":"召唤步骤","paragraphs":[],"bullets":["击杀普通潜影贝获取潜影贝核心。无抢夺时掉落概率75%；抢夺Ⅰ／Ⅱ／Ⅲ对应80%／85%／90%。","在末地准备神圣祭坛，确保不是和平难度，并且祭坛附近约100格内没有另一只潜影贝之王。","只投1个潜影贝核心到祭坛中心；避免把整组召唤物一起丢下。"]},{"heading":"战斗要点","paragraphs":["攻击中央放大的潜影贝本体。周围环绕的小潜影贝并不是需要逐个打掉的独立首领。","注意上方落下的尖刺、地面尖牙、伪装成潜影盒的爆炸物，以及召来的潜影贝和骷髅。它会破坏部分地形，选择远离基地和收藏品的战场。","贴身仍有接触伤害；不要以为一直躲在本体下面就安全。"],"bullets":[]},{"heading":"战利品","paragraphs":[],"bullets":["强化潜影壳×3–6，必掉。史诗品质，带附魔光效，普通潜影壳不能代替。","障壁之书可能掉落0–2本；抢夺提高获得机会，使用抢夺Ⅲ击杀可得到2本。","额外掉落黄金紫颂果和紫珀块，两种合计8–24个，单种数量随机。","不再直接掉落潜影工具或防具。"]},{"heading":"奖励如何使用","paragraphs":["每件潜影工具或防具在诅咒祭坛制作：对应下界合金装备×1、强化潜影壳×4、末影合金升级锻造模板×1。三种材料准确分成3堆。","障壁之书右键在前方制造实体障壁，持续约11秒，冷却15秒，适合挡住追兵或临时隔开战线。"],"bullets":[]},{"heading":"服务器范围","paragraphs":["本条介绍冒险服的首领挑战与奖励。生存服没有移植这些特殊首领的召唤与战利品；把成品装备带回后，效果以各物品页的生存服说明为准。"],"bullets":[]}],"recipes":[],"relatedNames":["神圣祭坛","诅咒祭坛","潜影贝核心","强化潜影壳","障壁之书","黄金紫颂果"],"sourcePack":"Stellarity","image":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAABE0lEQVR42mNgoBAwElIQpB//H8Zed3EhhnoWQpoiPbyQpf6jG8KITSOypjfP38LZVx9fYXj27iuKSxiRNcM0ImtCB1cfX2G4/vApw957GxkZGBgYmJAlb16+TzDQtGV1GDTlpRmclfz/YxgAM0REUhin7VcfX0ERQzFAWIQPqyHYNGKNhbdvPjEIi/AxvH3zieHm5fsM555eZ5AS4obLK0uoMDAwMDDcfXEHuwHnnl5n+HjjA0OIjTvD2zefMDRuOXmQgZ9XAMVQFC98/PyBYe+9jYy7L55k4OZnY/j4+QMDAwMDw+FrFxm2nDwID3msYYAtlaEbTDAMkBUh+xPdMGQDWUjNPOguYcSXiWBhgMv5VAEALuyB6j/18koAAAAASUVORK5CYII="},{"id":"mechanic-void-fishing","kind":"mechanic","name":"虚空钓鱼","aliases":["Void Fishing"],"category":"特殊机制","summary":"站在末地外岛边缘，把鱼钩抛向虚空，钓取特殊鱼、群系材料与宝藏。普通钓鱼竿即可开始。","facts":[{"label":"地点","value":"末地外岛；主岛及龙巢不适用"},{"label":"触发距离","value":"浮标距持竿玩家约20–30格"},{"label":"高度","value":"触发时浮标必须仍在Y≥0"},{"label":"收竿窗口","value":"提示上钩后约1–2秒"}],"sections":[{"heading":"操作步骤","paragraphs":[],"bullets":["在较高的外岛边缘找一处安全落脚点，准备普通钓鱼竿或虚空钓竿。","朝斜下方的虚空抛竿。浮标下降到离玩家约20–30格且还没有低于Y=0时，会开始虚空钓鱼；不需要造真实水池。","保持持竿，等待粒子和上钩水花音效。看到上钩提示后及时右键收竿。","若提示此处没有虚空鱼，换到外岛；若提示过深，找更高的边缘。"]},{"heading":"鱼竿与附魔","paragraphs":["虚空钓竿可从虚空钓鱼中获得，也能向末地村庄的专家级渔夫购买，基准价格14个末影合金碎片。它有264耐久，并有防火物品特性。","饵钓会缩短等待时间，海之眷顾会提高常规抽取中宝藏的比重。"],"bullets":[]},{"heading":"不同地区可以钓到什么","paragraphs":[],"bullets":["普遍鱼获包括末影锦鲤、涎鱼和水晶心鱼；不同外岛群系还有额外鱼和材料。","神圣之地：棱彩鱼、星辉尘及花叶材料。","冰刺之地：霜鲦鱼及冰雪材料。","血肉苔原：血肉食人鱼、绯红虎鱼及血肉材料。","火焰山：闪光锦鲤，以及烈焰棒、恶魂之泪等。","紫水晶森林与水晶峭壁：紫水晶芽鱼及紫水晶材料。","海晶森林：泡泡鱼及海晶材料。","无尽沙丘：钾鱼及沙漠植物材料。","诡异沼泽：涎鱼及苔藓、萤火虫灌木等材料。","末地高地、中型末地岛、小型末地岛和末地荒岛等地区：赘生鳕鱼、紫颂植物等。"]},{"heading":"宝藏与特殊抽取","paragraphs":["宝藏可能包括末影合金升级锻造模板、翼之钥匙、末地水晶、眼眸／尖塔盔甲纹饰模板及附魔书。杂物中也有紫珀块、末影珍珠、潜影壳和染料。","也有机会钓到虚空钓竿和收藏河豚，海之眷顾可提升宝藏机会。"],"bullets":[]},{"heading":"服务器范围","paragraphs":["本页的特殊制作或探索机制仅在冒险服开放。带回生存服的成品，是否具有相同能力请查看对应物品页。"],"bullets":[]}],"recipes":[],"relatedNames":["虚空钓竿","末影合金碎片","翼之钥匙","龙息坩埚","棱彩鱼","泡泡鱼"],"sourcePack":"Stellarity","image":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAABHElEQVR42sWTMUvDQBiGnyvdjdCC2AZPyFJwKOLkJgT8B25uN/of+hMc4xBw9j+cc4cQcChODqHBIdAh+QWfQ7mQtGloJ9/lDr577n2/jzv4D90GDzIZBQKgTgUBxt4UgI18H3eBA2/0PUW5ZpUtubg6I01TNTwWBPj8+gDgd/OjZvNQAIZ98C44m2usta3Uqg9uOrpaGG6drbXKGCODPngbVdc1Y4xo3U7R2UJRruu9tVaFYShaa+I4biX2PG/f/fHuWSajQFzUZuymjDH9Q9w9eEiDpvvYm/KyeOLt/ZWqqmp4NzpAlmXdM8jzHN/3OQS6ltwgVdN9lS25vD4HIEmSPVhERCml3FonKMq8ft9doFMURTThltzvOlV/P42DCPKuRZ0AAAAASUVORK5CYII="},{"id":"mechanic-altar-of-the-accursed","kind":"mechanic","name":"诅咒祭坛","aliases":["Altar of The Accursed"],"category":"特殊机制","summary":"击败末影龙后解锁的装备升级与特殊制作设施。材料以掉落物投入，堆数和每堆数量都必须符合配方。","facts":[{"label":"解锁","value":"击败末影龙后约8秒激活"},{"label":"投放范围","value":"祭坛中心约1.5格内，物品需要落地"},{"label":"撤回材料","value":"在祭坛附近潜行后拾取"}],"sections":[{"heading":"第一次使用","paragraphs":[],"bullets":["击败末影龙，等待祭坛苏醒。","到祭坛与剑互动，取出龙之刃。之后可按物品配方进行合成。","把配方的每一种材料按指定数量组成一堆，准确丢在祭坛中心。","等待合成完成并拾取产物；失败时先清走无关掉落物，检查材料是否为正确的特殊物品。"]},{"heading":"堆数为什么重要","paragraphs":["例如“下界合金剑×1＋强化潜影壳×4＋末影合金升级锻造模板×1”需要正好3堆：1把剑、1堆4壳、1枚模板。把壳拆成4堆，或在旁边留下其他材料，都会影响识别。","不要一次投几套配方试图批量制作。完成合成会消耗本次配方投入物；未完成时可在附近潜行取回。"],"bullets":[]},{"heading":"装备升级与材料保留","paragraphs":["潜影系列现在统一使用强化潜影壳，每件4个，普通潜影壳不可替代。神圣、紫颂冠军和花卉护甲也在此升级。","多数装备升级会继承原装备的附魔及适用纹饰，但不代表名称、损坏程度和所有特殊数据都会完整保留。"],"bullets":[]},{"heading":"吊坠与鞘翅","paragraphs":["虚空吊坠可在这里更换单一镶嵌。旧镶嵌被替换，不会叠加，也不会返还旧材料。","普通鞘翅与1个染料分成2堆可染色；与1个水桶分成2堆可洗去颜色。特殊物品的材料识别不同，不要默认所有特殊翼都适用普通鞘翅配方。"],"bullets":[]},{"heading":"服务器范围","paragraphs":["本页的特殊制作或探索机制仅在冒险服开放。带回生存服的成品，是否具有相同能力请查看对应物品页。"],"bullets":[]}],"recipes":[{"station":"诅咒祭坛","ingredients":[{"name":"铁锭","count":1},{"name":"爆裂紫颂果","count":2}],"result":{"name":"紫颂覆板","count":1},"note":"准确放成2堆。"},{"station":"诅咒祭坛","ingredients":[{"name":"末影合金升级锻造模板","count":1},{"name":"紫珀块","count":9},{"name":"末影合金碎片","count":5}],"result":{"name":"末影合金升级锻造模板","count":2},"note":"消耗原模板；净增加1枚，准确放成3堆。"},{"station":"诅咒祭坛","ingredients":[{"name":"下界合金剑","count":1},{"name":"强化潜影壳","count":4},{"name":"末影合金升级锻造模板","count":1}],"result":{"name":"潜影剑","count":1},"note":"准确放成3堆。其他潜影工具与护甲用对应部位的下界合金装备。"}],"relatedNames":["末影龙","龙之刃","强化潜影壳","虚空吊坠","末影合金升级锻造模板"],"sourcePack":"Stellarity","image":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAB5klEQVR42pWQMWgTARSG/zu92NxpriWnpkchNZMQSsUleuhgCnWwIg4FaYW0SD3bqoOLSmcR2kO76CAFkRAXcQh44GLpIEYoVIPYZElsY7RYjfaM2tQe/k4tQutp/u0N3/vf+wTUmf7dMS5zFV+wgrpzvvkwWZsnF7+Sbys8EGhlffCCS95+wmpuqT744p44q7kl5s1xlp6/qQ82Q/2sZD5w6miK5YcFRrYF/x8+HTI5M55h8tAE82Mzm8Lin0N2xOVckgSAkyGT3R29eJF+h9a2gyi9dOEK6oaSrQCQ6spyu38HKmUH7deCQnxnD/s6evE4M41V1NCwxY+rTy+gVCsKGy64E3/Ghc9lnEkfQfxeUIg1HeNAex/uTz3CuVOXUF1xUFqex49f3zb/0zJsar4wbbNASZR5I3aXnVqClmGzU0vwyr7r1Hy7/ipOLDqv4bgfkXuVh+xvxOXpYexv2YsHs7egBXyYmL2JTz8XBU/bJ8KDVBWdc0nSMmxKosyeyMB685pYz0iiTMuwORQdparolESZADCZqDA74vKf8PHmQUqiTFXRaRk2bbNAzRdmurvoDauKzrGWDFVF59o7kihT84VpGTZTXVnPBYIkypT9jXC+v18XNRQdZUSNItDQhLOThqfA38EE6aWQmuJoAAAAAElFTkSuQmCC"},{"id":"mechanic-altar-of-the-sacred","kind":"mechanic","name":"神圣祭坛","aliases":["Altar of the Sacred"],"category":"特殊机制","summary":"光之圣堂中央的可搬运祭坛。用于召唤光之女皇、潜影贝之王，或用金属和宝石换取临时祝福。","facts":[{"label":"发现地点","value":"神圣之地、棱彩沙丘、神圣苔原中的光之圣堂"},{"label":"寻找帮助","value":"末地村庄老手级制图师出售圣堂探险地图"}],"sections":[{"heading":"寻找与搬运","paragraphs":["探索光之圣堂中央可找到祭坛。末地制图师的探险地图基准价格为1张空地图与50个末影合金碎片。","破坏祭坛的哭泣黑曜石基座可回收祭坛物品，再放置到需要的地点。挑战白昼光之女皇时，需要把祭坛搬到主世界。"],"bullets":[]},{"heading":"两种召唤","paragraphs":[],"bullets":["星辉尘×1：召唤光之女皇，非和平难度且没有其他光女存活。","潜影贝核心×1：在末地召唤潜影贝之王，非和平难度且附近没有另一只潜影贝之王。","召唤材料应单独投入1份，不要把整组丢在祭坛上。"]},{"heading":"材料祝福","paragraphs":["把一种金属或宝石以掉落物形式丢到祭坛上，整堆材料会被消耗，最近的玩家获得对应临时效果。一次投入更多同种材料会延长时间。"],"bullets":["铁锭：抗性提升Ⅰ；1个约3分钟。","金锭：急迫Ⅰ；1个约3分31秒。","绿宝石：村庄英雄Ⅰ；1个约4分16秒。","钻石：速度Ⅰ；1个约5分32秒。","下界合金锭：抗火；1个约19分7秒。"]},{"heading":"不要与神圣化混淆","paragraphs":["神圣祭坛投入铁锭得到的是临时抗性祝福，不是神圣锭。神圣锭需要使用“神圣化”水域或炼药锅。","当前版本的宝藏头重抽不可正常产出新头，不要将珍藏的宝藏头投入祭坛尝试。"],"bullets":[]},{"heading":"服务器范围","paragraphs":["生存服只支持神圣祭坛的放置、挖掘和回收，不提供材料祝福或首领召唤。需要举行仪式时请前往冒险服。"],"bullets":[]}],"recipes":[],"relatedNames":["光之女皇","潜影贝之王","神圣化","星辉尘","潜影贝核心"],"sourcePack":"Stellarity","image":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAuklEQVR42qWTuw7DIAxFT5GRGDL3/7+uQ6R2iDJYAqkdENTQJM3jLshG2MfGvr3Gx5ukIIGqpPm0vhW/AMw6ARMAMUYAvPfE+MR73/jLHcAw3HOAYvxkGzoqk3meR0j6DdAg/rMlZKIAjqQN3i4lzWVIwCEhG322LRWCpLjaoL7juwkuytVoR1RKAENwpAcNgYl2WElNCaebeIbAvBE725sL1Y1yeSN2tnuSslBLy9VsY12kpZ8I6xQAH7+HZcnR1UQhAAAAAElFTkSuQmCC"},{"id":"mechanic-consecration","kind":"mechanic","name":"神圣化","aliases":["Consecration","圣化"],"category":"特殊机制","summary":"把材料投入神圣地区的水，或用星辉尘激活装水炼药锅，进行材料转化。它与神圣祭坛的祝福是两种玩法。","facts":[{"label":"自然地点","value":"神圣之地、棱彩沙丘、神圣苔原的水或装水炼药锅"},{"label":"便携方式","value":"向装水炼药锅投入星辉尘"},{"label":"等待","value":"转化动画约3秒；便携锅一次激活约20秒"}],"sections":[{"heading":"操作步骤","paragraphs":[],"bullets":["在上述神圣群系找到水，或在任意地方准备装水的炼药锅。","使用便携方式时，向锅内只丢1份星辉尘。不要与龙息坩埚混用同一锅。","再丢入需要转化的物品，等发光动画结束后拾取产物。","如果物品被带离水或有效锅体，转化会中止。"]},{"heading":"完整转换表","paragraphs":["下方列出当前可获得材料对应的全部有效转换。箭头方向以每条配方为准；可双向转换的材料会分别列出，不能自行推定反向也成立。","木材只接受列出的树种和形态，竹块、菌柄和樱花木不在转化为樱花木的输入范围内。"],"bullets":[]},{"heading":"投放前注意","paragraphs":["转化会消耗整堆原物品，再生成对应数量的产物。原名称、附魔、纹饰和特殊属性通常不会保留。","部分规则按物品的原版材质判断，所以外观特殊的同底材装备也可能被转化。贵重装备不要随意丢进神圣化水中。"],"bullets":[]},{"heading":"目前不要投入的材料","paragraphs":["滴水石锥、镶金黑石、下界金矿石、石台阶与石楼梯的旧转换不能正常得到产物，请勿投入；本页不将它们列作可用配方。"],"bullets":[]},{"heading":"服务器范围","paragraphs":["本页的特殊制作或探索机制仅在冒险服开放。带回生存服的成品，是否具有相同能力请查看对应物品页。"],"bullets":[]}],"recipes":[{"station":"神圣化水域／星辉尘炼药锅","ingredients":[{"name":"橡树树叶／苍白橡树树叶／白桦树叶／云杉树叶／丛林树叶／金合欢树叶／深色橡树树叶／红树树叶（任选一种）","count":1}],"result":{"name":"樱花树叶","count":1},"note":"整堆转化，数量1∶1；原有附魔、名称等不保留。"},{"station":"神圣化水域／星辉尘炼药锅","ingredients":[{"name":"橡树树苗／苍白橡树树苗／白桦树苗／云杉树苗／丛林树苗／金合欢树苗／深色橡树树苗（任选一种）","count":1}],"result":{"name":"樱花树苗","count":1},"note":"整堆转化，数量1∶1；原有附魔、名称等不保留。"},{"station":"神圣化水域／星辉尘炼药锅","ingredients":[{"name":"橡木原木／苍白橡木原木／白桦原木／云杉原木／丛林原木／深色橡木原木／金合欢原木／红树原木（任选一种）","count":1}],"result":{"name":"樱花原木","count":1},"note":"整堆转化，数量1∶1；原有附魔、名称等不保留。"},{"station":"神圣化水域／星辉尘炼药锅","ingredients":[{"name":"橡木／苍白橡木／白桦木／云杉木／丛林木／深色橡木／金合欢木／红树木（任选一种）","count":1}],"result":{"name":"樱花木","count":1},"note":"整堆转化，数量1∶1；原有附魔、名称等不保留。"},{"station":"神圣化水域／星辉尘炼药锅","ingredients":[{"name":"去皮橡木原木／去皮苍白橡木原木／去皮白桦原木／去皮云杉原木／去皮丛林原木／去皮深色橡木原木／去皮金合欢原木／去皮红树原木（任选一种）","count":1}],"result":{"name":"去皮樱花原木","count":1},"note":"整堆转化，数量1∶1；原有附魔、名称等不保留。"},{"station":"神圣化水域／星辉尘炼药锅","ingredients":[{"name":"去皮橡木／去皮苍白橡木／去皮白桦木／去皮云杉木／去皮丛林木／去皮深色橡木／去皮金合欢木／去皮红树木（任选一种）","count":1}],"result":{"name":"去皮樱花木","count":1},"note":"整堆转化，数量1∶1；原有附魔、名称等不保留。"},{"station":"神圣化水域／星辉尘炼药锅","ingredients":[{"name":"凋灵玫瑰","count":1}],"result":{"name":"虞美人","count":1},"note":"整堆转化，数量1∶1；原有附魔、名称等不保留。"},{"station":"神圣化水域／星辉尘炼药锅","ingredients":[{"name":"枯萎的灌木","count":1}],"result":{"name":"灌木丛","count":1},"note":"整堆转化，数量1∶1；原有附魔、名称等不保留。"},{"station":"神圣化水域／星辉尘炼药锅","ingredients":[{"name":"硫黄尖锥","count":1}],"result":{"name":"滴水石锥","count":1},"note": 者还必掉 1 个神殿核心。","由玩家完成最后一击才能得到上述专项奖励。抢夺不增加固定数量，辅助精英唤魔者也不都掉战斗之证。"]},{"heading":"针叶林哨塔的北极熊","paragraphs":["塔顶的精英北极熊有 100 点生命、6 点护甲，带迅捷 II、抗性提升 II 与力量 VIII，能跨过较高障碍。它保留北极熊的中立行为，受攻击后会反击。","玩家击杀必得 2 张战斗之证，并保留普通鱼类掉落。已探索的旧哨塔不一定有这只熊。"],"bullets":[]},{"heading":"铁傀儡不能轻松代打","paragraphs":["部分精英的普通近战、弓箭、投掷三叉戟等攻击，对铁傀儡造成的基础伤害提高至 3 倍；这些加成不额外作用于玩家。","监守者音波、唤魔者尖牙及部分特殊攻击仍各按自己的规则结算。不要把铁傀儡视为稳定无风险的通关方式。"],"bullets":[]}],"recipes":[],"relatedNames":["战斗之证","三种成长凭证","神殿核心","幽匿心脏","针叶林哨塔","霜冻地牢","冰封尖塔","远古神庙塔"],"sourcePack":"CCT-More","survival":{"status":"none","label":"冒险服探索内容","summary":"这些结构精英和专项掉落未迁移到生存服；材料可以带回后使用。","details":[]}},{"id":"mechanic-cct-archaeology-reinforcement","kind":"mechanic","name":"考古与远古强化碎片","aliases":["考古","远古强化","强化模板"],"category":"成长机制","summary":"用刷子探索可疑的沙子和可疑的沙砾，集齐远古强化碎片，再制作模板与附魔书。不同遗址提供不同种类的碎片。","facts":[],"sections":[{"heading":"去哪里找碎片","paragraphs":[],"bullets":["沙漠神殿、沙漠水井：远古强化碎片-高效、远古强化碎片-轻便。","冷海和暖海海底废墟：远古强化碎片-锋刃、远古强化碎片-坚韧、远古强化碎片-剑气。","古迹废墟：远古强化碎片-尖锐、远古强化碎片-敏捷。","这些地点还可能刷出冒险之证。沙漠神殿可以刷出日耀圣戟，冷暖海底废墟可以刷出唤雷圣戟。","以上为常规考古地点；扩展地形中的残垣考古另有对应奖励，见相关结构与碎片页面。"]},{"heading":"从碎片到附魔","paragraphs":["先把同种碎片×4、钻石×4与试炼之魂×1放入工作台，制作对应的远古强化锻造模板。","再用模板×1、书×1与附魔之瓶×1制作对应的 I 级附魔书，最后在铁砧应用到适用装备。每次制作都会消耗投入的材料。","七种远古强化在同一件装备上相互排斥。轻便模板用于制作轻便强化书；“尖锐”碎片所制作的模板在物品名称中叫“延展”，最终对应尖锐强化。"],"bullets":[]}],"recipes":[],"relatedNames":["冒险之证","试炼之魂","远古强化碎片-高效","远古强化碎片-轻便","远古强化碎片-锋刃","远古强化碎片-坚韧","远古强化碎片-剑气","远古强化碎片-尖锐","远古强化碎片-敏捷","特殊工作台合成"],"sourcePack":"CCT-More","survival":{"status":"partial","label":"材料可带回；考古来源在冒险服","summary":"上述额外考古奖励未迁移到生存服。碎片可以带回，特殊工作台配方的开放情况见配方页。","details":[]}},{"id":"mechanic-intrinsic-enchantments","kind":"mechanic","name":"固有附魔与砂轮","aliases":["装备内置附魔","固有能力","洗附魔"],"category":"装备与附魔","summary":"特殊装备的固有附魔不能用砂轮洗掉；普通附魔仍可按正常规则去除，洗附魔不会解除固有互斥。","facts":[{"label":"适用服务器","value":"冒险服与生存服"},{"label":"灵魂收割者成长","value":"保留灵魂、成长属性与已解锁能力"}],"sections":[{"heading":"哪些属于固有附魔","paragraphs":["灵魂收割者的同名附魔、龙之刃的龙魂灌注、炽金狂斧的破晓、棱彩武器的地狱灌注、沙暴三叉戟的狂风，以及虚空之唤自带的虚空之箭，都是装备原有能力的一部分。","虚空吊坠的镶嵌、棱彩珍珠的返还 <script>
'use strict';
const DB=JSON.parse(document.getElementById('wiki-data').textContent), entries=DB.entries;
const byId=new Map(entries.map(e=>[e.id,e])), byName=new Map();
// These names remain searchable but cannot identify a unique special item in prose or recipes.
const genericNames=new Set(['附魔书','锻造模板','谜之炖菜','鞘翅','画','烟火之星','工作台制作','熔炼与营火','世界地形','建筑指南','合成表','沙子','河豚']);
for(const e of entries)byName.set(e.name,e);
for(const e of entries)for(const n of e.aliases||[])if(!genericNames.has(n)&&!byName.has(n))byName.set(n,e);
for(const n of genericNames)byName.delete(n);
const kinds=[['all','全部条目','✦'],['item','物品与合成','◇'],['structure','结构与探索','▧'],['enchantment','附魔','✧'],['boss','Boss','♜'],['mechanic','特殊玩法','◈']];
const view=document.getElementById('view'),search=document.getElementById('search');let kind='all',cat='全部',query='',limited=false,sourceFilter='全部来源',lastIndex={kind:'all',cat:'全部',query:'',limited:false,sourceFilter:'全部来源'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const aliases=e=>(e.aliases||[]).filter(x=>x!==e.name);
const limitedStatus=e=>e.survival&&['partial','none','unknown'].includes(e.survival.status);
const survivalLabel=e=>e.survival?(['enchantment-critical-strike','item-enchantment-book-critical_strike'].includes(e.id)?'生存服可用 · 有差异':{full:'生存服可用',native:'生存服可用',partial:'生存服部分生效',none:'生存服不生效',unknown:'生存服尚未确认'}[e.survival.status]||''):'';
const badge=e=>e.survival?`<span class="compat-badge ${esc(e.survival.status)}">${survivalLabel(e)}</span>`:'';
const survivalBox=e=>e.survival?`<aside id="survival" class="survival-box ${esc(e.survival.status)}" aria-label="生存服兼容说明"><h2>${survivalLabel(e)}</h2><p>${esc(e.survival.summary)}</p>${e.survival.details?.length?`<ul>${e.survival.details.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:''}</aside>`:'';
const kindName=k=>kinds.find(x=>x[0]===k)?.[1]||'条目';
const img=e=>e?.image||DB.fallbacks?.[e?.kind]||DB.fallbacks?.item||'';
const icon=e=>`<span class="icon-box"><img src="${img(e)}" alt="" loading="lazy"></span>`;
const linkName=n=>{const e=byName.get(n);return e?`<a href="#${encodeURIComponent(e.id)}">${esc(n)}</a>`:esc(n)};
const longestNames=[...byName.keys()].filter(n=>n.length>=3&&!/^[\x00-\x7F]*$/.test(n)).sort((a,b)=>b.length-a.length);
const nameRegex=new RegExp(longestNames.map(n=>n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')||'(?!)','g');
const rich=(s,self)=>{let out='',pos=0;for(const m of String(s??'').matchAll(nameRegex)){out+=esc(String(s).slice(pos,m.index));const e=byName.get(m[0]);out+=e&&e.id!==self?`<a href="#${encodeURIComponent(e.id)}">${esc(m[0])}</a>`:esc(m[0]);pos=m.index+m[0].length}return out+esc(String(s??'').slice(pos))};
function goIndex(k='all'){kind=k;cat='全部';query='';limited=false;sourceFilter='全部来源';search.value='';location.hash='all';renderIndex();closeMenu();window.scrollTo(0,0)}
document.getElementById('nav').innerHTML=kinds.map(([k,n,g])=>`<button class="nav-button" data-kind="${k}"><span class="nav-glyph" aria-hidden="true">${g}</span><span>${n}</span><span class="num">${k==='all'?entries.length:entries.filter(e=>e.kind===k).length}</span></button>`).join('');
document.getElementById('nav').addEventListener('click',ev=>{const b=ev.target.closest('[data-kind]');if(b)goIndex(b.dataset.kind)});
const quickNames=['全部合成速查','特殊工作台合成','主世界与三界探索','诅咒祭坛','虚空钓鱼'];
document.getElementById('quick-links').innerHTML=[...new Set(quickNames.map(n=>byName.get(n)).filter(Boolean))].slice(0,5).map(e=>`<a class="quick-link" href="#${e.id}">${esc(e.name)}</a>`).join('');
document.getElementById('brand-icon').src=DB.brand||DB.fallbacks.item;
function setNav(k){document.querySelectorAll('[data-kind]').forEach(el=>{el.classList.toggle('active',el.dataset.kind===k);el.setAttribute('aria-current',el.dataset.kind===k?'page':'false')})}
const texts=new Map(entries.map(e=>[e.id,JSON.stringify([e.name,e.aliases,e.summary,e.category,e.facts,e.sections,e.recipes,e.survival,e.sourcePack]).toLowerCase()]));
function score(e,q){const n=e.name.toLowerCase(),a=aliases(e).join(' ').toLowerCase();if(n===q||a===q)return 100;if(n.includes(q))return 60;if(a.includes(q))return 40;return texts.get(e.id).includes(q)?10:0}
function packOverview(){return `<section class="pack-strip" aria-label="按内容来源浏览"><h2 class="pack-heading">按内容来源浏览</h2><div class="pack-grid">${(DB.packGuides||[]).map(p=>`<button class="pack-card" data-pack="${esc(p.name)}"><strong>${esc(p.name)}</strong><span>${esc(p.subtitle)}</span><small>${esc(p.description)}</small><small class="pack-count">${entries.filter(e=>e.sourcePack===p.name).length} 个条目 · 点击浏览</small></button>`).join('')}</div></section>`}
function renderIndex(){document.title='CCT · 玩家 Wiki';setNav(kind);document.getElementById('clear').classList.toggle('hidden',!query);lastIndex={kind,cat,query,limited,sourceFilter};const base=entries.filter(e=>kind==='all'||e.kind===kind),cats=[...new Set(base.map(e=>e.category).filter(Boolean))];const qs=query.toLowerCase().trim().split(/\s+/).filter(Boolean);let found=base.filter(e=>(cat==='全部'||e.category===cat)&&(!limited||limitedStatus(e))&&(sourceFilter==='全部来源'||e.sourcePack===sourceFilter)&&qs.every(q=>score(e,q)>0));if(qs.length)found.sort((a,b)=>qs.reduce((v,q)=>v+score(b,q)-score(a,q),0));
let title=query?`“${esc(query)}”的搜索结果`:sourceFilter!=='全部来源'?esc(sourceFilter)+(kind==='all'?'':' · '+kindName(kind)):kind==='all'?'探索 CCT 世界':kindName(kind);let intro=kind==='all'&&!query&&!limited&&cat==='全部'&&sourceFilter==='全部来源';const lead=intro?'查找装备、附魔与配方，探索三界建筑，了解物品在冒险服和生存服的使用方式。':({item:'查找装备效果、获取地点与制作材料。',structure:'了解在哪里探索、需要准备什么、能带回什么。',enchantment:'了解可用装备、最高等级与附魔效果。',boss:'召唤条件、战斗要点与专属奖励。',mechanic:'从祭坛制作到虚空钓鱼，按步骤开始。'}[kind]||'');
const featured=['全部合成速查','主世界与三界探索','光之女皇'].map(n=>byName.get(n)).filter(Boolean);
view.innerHTML=`<div class="index-heading"><div><p class="eyebrow">FIELD GUIDE / ${esc(kind==='all'?'冒险手册':kindName(kind))}</p><h1>${title}</h1>${lead?`<p class="lead">${lead}</p>`:''}</div><span class="count-label" role="status">${found.length} 个条目</span></div>${intro&&featured.length?`<div class="intro-grid">${featured.map((e,i)=>`<a class="intro-link" href="#${e.id}"><img src="${img(e)}" alt=""><div><b>${esc(e.name)}</b><span>${['材料与摆法','村庄、遗址与高塔','召唤与奖励'][i]}</span></div></a>`).join('')}</div>`:''}${intro?packOverview():''}${cats.length>1?`<div class="filter-row" aria-label="条目分类"><button class="chip" data-cat="全部" aria-pressed="${cat==='全部'}">全部</button>${cats.map(c=>`<button class="chip" data-cat="${esc(c)}" aria-pressed="${cat===c}">${esc(c)}</button>`).join('')}</div>`:''}<div class="source-filter"><label for="source-filter">内容来源</label><select id="source-filter">${['全部来源',...new Set(entries.map(e=>e.sourcePack))].map(n=>`<option ${n===sourceFilter?'selected':''}>${esc(n)}</option>`).join('')}</select></div>${['all','item','enchantment'].includes(kind)?`<label class="compat-filter"><input type="checkbox" id="limited-filter" ${limited?'checked':''}>只看生存服受限条目</label>`:''}<div class="cards">${found.map(e=>`<a class="card" href="#${encodeURIComponent(e.id)}"><div class="card-top">${icon(e)}<div><div class="card-title">${esc(e.name)}</div><div class="card-type">${esc(e.category||kindName(e.kind))} · ${esc(e.sourcePack||'')}</div>${badge(e)}</div></div><p class="card-summary">${esc(e.summary)}</p><div class="card-meta">${esc(aliases(e).find(x=>/[a-z]/i.test(x))||kindName(e.kind))}</div></a>`).join('')}</div>${!found.length?'<div class="empty"><h2>没有找到对应条目</h2><p>试试名称中的一部分，例如“虚空”“钥匙”或“祭坛”，也可以使用英文名称。</p><button class="chip" id="reset-filters">清除筛选</button></div>':''}<footer class="site-footer">CCT 玩家 Wiki · 获取、合成与跨服使用 · ${entries.length} 个条目 · <time datetime="${esc(DB.updated)}">${esc(DB.updated)} 更新</time></footer>`;
view.querySelectorAll('[data-pack]').forEach(b=>b.onclick=()=>{sourceFilter=b.dataset.pack;cat='全部';query='';limited=false;search.value='';renderIndex();window.scrollTo(0,0)});
document.getElementById('source-filter').onchange=ev=>{sourceFilter=ev.target.value;renderIndex()};const lf=document.getElementById('limited-filter');if(lf)lf.onchange=()=>{limited=lf.checked;renderIndex()};view.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;renderIndex()});const reset=document.getElementById('reset-filters');if(reset)reset.onclick=()=>goIndex('all')}
function ingredient(i,result=false){const e=byName.get(i.name);return `<span class="ingredient ${result?'recipe-result':''}">${e?`<img src="${img(e)}" alt="">`:''}<span>${linkName(i.name)}</span>${i.count!==undefined?`<span class="qty">×${esc(i.count)}</span>`:''}</span>`}
function recipeDetails(r,self){return `${r.note?rich(r.note,self):''}${r.condition?`<p class="recipe-condition">${rich(r.condition,self)}</p>`:''}${r.shape?.length?`<div class="craft-grid" aria-label="工作台摆法">${r.shape.flat().map(n=>`<span class="craft-slot ${n==='空位'?'empty-slot':''}">${n==='空位'?'空':linkName(n)}</span>`).join('')}</div>`:''}`};
function compactRecipes(e){return `<div class="recipe-search"><label for="recipe-filter">查找本页配方</label><input id="recipe-filter" type="search" placeholder="输入材料或产物名称" autocomplete="off"><span id="recipe-count" role="status">${e.recipes.length} 条</span></div><table class="recipe-table"><thead><tr><th scope="col">投入材料</th><th scope="col">获得</th><th scope="col">制作说明</th></tr></thead><tbody>${e.recipes.map(r=>`<tr><td><div class="table-ingredients">${(r.ingredients||[]).map(i=>ingredient(i)).join('＋')}</div></td><td>${ingredient(r.result||{name:e.name,count:1},true)}</td><td><span class="station">${esc(r.station)}</span>${recipeDetails(r,e.id)}</td></tr>`).join('')}</tbody></table>`}
function guideTable(t,label){return `<div class="guide-table-wrap"><table class="guide-table" aria-label="${esc(label)}"><thead><tr>${t.headers.map(h=>`<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>${t.rows.map(row=>`<tr>${row.map((v,i)=>i===0?`<th scope="row">${esc(v)}</th>`:`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function renderEntry(e){document.title=e.name+' · CCT Wiki';setNav(e.kind);closeMenu();let sections=(e.sections||[]).filter(s=>(s.paragraphs?.length||s.bullets?.length||s.table?.rows?.length));const headings=sections.map((s,i)=>({id:'section-'+i,label:s.heading}));if(e.survival)headings.unshift({id:'survival',label:'生存服兼容'});if(e.recipes?.length)headings.push({id:'recipes',label:'合成与制作'});const related=[...new Set((e.relatedNames||[]).map(n=>byName.get(n)).filter(x=>x&&x.id!==e.id))];if(related.length)headings.push({id:'related',label:'相关条目'});
view.innerHTML=`<div class="crumb"><button class="back-button" id="back">返回目录</button><span>/</span><span>${esc(e.category||kindName(e.kind))}</span></div><div class="article-grid"><article class="article"><header class="article-head">${icon(e)}<div><p class="eyebrow">${esc(kindName(e.kind))}</p><h1>${esc(e.name)}</h1>${aliases(e).length?`<p class="aliases">${esc(aliases(e).join(' · '))}</p>`:''}</div></header>${survivalBox(e)}<p class="scope-note">探索、掉落与祭坛玩法以冒险服为准；生存服能力见兼容标注，特殊工作台配方见各自说明。</p><p class="summary">${rich(e.summary,e.id)}</p>${e.facts?.length?`<dl class="facts">${e.facts.map(f=>`<div class="fact"><dt class="fact-label">${esc(f.label)}</dt><dd class="fact-value" style="margin:0">${rich(f.value,e.id)}</dd></div>`).join('')}</dl>`:''}${sections.map((s,i)=>`<section class="article-section" id="section-${i}"><h2>${esc(s.heading)}</h2>${(s.paragraphs||[]).map(p=>`<p>${rich(p,e.id)}</p>`).join('')}${s.bullets?.length?`<ul>${s.bullets.map(b=>`<li>${rich(b,e.id)}</li>`).join('')}</ul>`:''}${s.table?.rows?.length?guideTable(s.table,s.heading):''}</section>`).join('')}${e.recipes?.length?`<section class="article-section" id="recipes"><h2>合成与制作</h2>${e.recipes.length>12?compactRecipes(e):e.recipes.map(r=>`<div class="recipe"><div class="recipe-head"><b>${esc(r.station)}</b><span>${esc(r.title||'制作配方')}</span></div><div class="recipe-body">${(r.ingredients||[]).map(i=>ingredient(i)).join('<span aria-hidden="true">＋</span>')}<span class="recipe-equals" aria-label="制成">＝</span>${ingredient(r.result||{name:e.name,count:1},true)}</div>${r.note||r.condition||r.shape?.length?`<div class="recipe-note">${recipeDetails(r,e.id)}</div>`:''}</div>`).join('')}</section>`:''}${related.length?`<section class="article-section" id="related"><h2>相关条目</h2><div class="related">${related.map(x=>`<a href="#${encodeURIComponent(x.id)}">${esc(x.name)}</a>`).join('')}</div></section>`:''}<footer class="article-footer">${esc(e.sourcePack||'综合指南')} · ${esc(DB.updated.replaceAll("-","."))} 校对</footer></article><nav class="toc" aria-label="本页目录"><b>本页内容</b>${headings.map(h=>`<a href="#${e.id}" data-scroll="${h.id}">${esc(h.label)}</a>`).join('')}</nav></div>`;
const rf=document.getElementById('recipe-filter');if(rf)rf.oninput=()=>{const q=rf.value.trim().toLowerCase();let count=0;view.querySelectorAll('.recipe-table tbody tr').forEach(tr=>{tr.hidden=!tr.textContent.toLowerCase().includes(q);if(!tr.hidden)count++});document.getElementById('recipe-count').textContent=count?count+' 条':'没有匹配的配方'};document.getElementById('back').onclick=()=>{({kind,cat,query,limited,sourceFilter}=lastIndex);search.value=query;location.hash='all';renderIndex();window.scrollTo(0,0)};view.querySelectorAll('[data-scroll]').forEach(a=>a.onclick=ev=>{ev.preventDefault();document.getElementById(a.dataset.scroll)?.scrollIntoView({behavior:'smooth'})});window.scrollTo(0,0)}
function route(){const id=decodeURIComponent(location.hash.slice(1));const e=byId.get(id);if(e)renderEntry(e);else renderIndex()}
window.addEventListener('hashchange',route);let timer;search.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>{query=search.value;cat='全部';if(location.hash!=='#all')history.replaceState(null,'','#all');renderIndex()},100)});document.getElementById('clear').onclick=()=>{search.value='';query='';renderIndex();search.focus()};document.addEventListener('keydown',ev=>{if(ev.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){ev.preventDefault();search.focus()}if(ev.key==='Escape'){closeMenu();search.blur()}});
const menu=document.querySelector('.menu');menu.onclick=()=>{const on=document.body.classList.toggle('nav-open');menu.setAttribute('aria-expanded',String(on))};function closeMenu(){document.body.classList.remove('nav-open');menu.setAttribute('aria-expanded','false')}document.querySelector('.scrim').onclick=closeMenu;document.querySelector('.brand').onclick=()=>goIndex('all');route();
</script>
</body></html>
